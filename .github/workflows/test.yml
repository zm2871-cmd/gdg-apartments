name: test
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data-pipeline/package-lock.json
      - run: npm ci
      - run: npm test
